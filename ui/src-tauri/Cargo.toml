[package]
name = "chatgpt-harness-ui"
version = "0.1.3"
description = "ChatGPT-Harness Tauri control plane"
authors = ["ChatGPT-Harness"]
edition = "2021"

[lib]
name = "chatgpt_harness_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
# Opt in only on Windows hosts that can load the native Wry event loop.
native-tray-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.6.0"
harness-control-protocol = { path = "../../protocol" }
chatgpt-harness-evidence-store = { path = "../../runtime/evidence-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
