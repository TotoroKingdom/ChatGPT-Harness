[package]
name = "chatgpt-harness-ui"
version = "0.1.0"
description = "ChatGPT-Harness Tauri control plane"
authors = ["ChatGPT-Harness"]
edition = "2021"

[lib]
name = "chatgpt_harness_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
harness-control-protocol = { path = "../../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
