[package]
name = "chatgpt-harness-evidence-store"
version = "0.1.3"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
fs2 = "0.4"
harness-control-protocol = { path = "../../protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
