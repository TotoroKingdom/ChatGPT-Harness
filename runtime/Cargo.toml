[package]
name = "chatgpt-harness-runtime"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "chatgpt-harness-runtime"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
harness-control-protocol = { path = "../protocol" }
chatgpt-harness-evidence-store = { path = "evidence-store" }
chrono = { version = "0.4", features = ["clock"] }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1.13"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
jsonschema = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

