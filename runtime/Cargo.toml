[package]
name = "chatgpt-harness-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chatgpt-harness-runtime"
path = "src/main.rs"

[dependencies]
harness-control-protocol = { path = "../protocol" }
chrono = { version = "0.4", features = ["clock"] }
globset = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["serde", "v4"] }
