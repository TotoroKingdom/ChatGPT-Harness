[package]
name = "m00-evidence-store-poc"
version = "0.1.0"
edition = "2021"
publish = false

# Keep this disposable POC outside the production workspace. It must never be
# imported by chatgpt-harness-runtime or chatgpt-harness-ui.
[workspace]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
